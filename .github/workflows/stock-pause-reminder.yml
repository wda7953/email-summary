name: 12/6 美股暫停定期定股提醒（一次性）

on:
  schedule:
    - cron: '0 1 6 12 *'  # 12 月 6 日 09:00 台灣時間（UTC+8）；一次性提醒，發完即可刪除此 workflow
  workflow_dispatch:

jobs:
  send-reminder:
    runs-on: ubuntu-latest
    steps:
      - name: 傳送 LINE 提醒
        run: |
          curl -s -X POST https://api.line.me/v2/bot/message/push \
            -H "Authorization: Bearer ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"to": "${{ secrets.LINE_USER_ID }}", "messages": [{"type": "text", "text": "📈 美股提醒：記得去暫停「定期定股」交易了（12/6 交辦）"}]}'
