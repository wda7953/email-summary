name: 週日排程總覽

on:
  schedule:
    - cron: '0 1 * * 0'  # 每週日 09:00 台灣時間（UTC+8）
  workflow_dispatch:

jobs:
  send-summary:
    runs-on: ubuntu-latest
    steps:
      - name: 傳送 LINE 排程總覽
        run: |
          curl -s -X POST https://api.line.me/v2/bot/message/push \
            -H "Authorization: Bearer ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{
              "to": "${{ secrets.LINE_USER_ID }}",
              "messages": [{
                "type": "text",
                "text": "📋 本週自動排程總覽\n\n【每天】\n・10:00 Gmail 摘要\n\n【每週日】\n・09:00 排程總覽（本則）\n・14:00 記憶整理提醒\n\n【每月】\n・1日 09:00 開發票提醒\n・11日 09:00 檢查 21888 是否入帳\n・月底 22:00 武士月業績報告\n・1日 22:00 收入月報\n・4日 09:00 Joyce／孟潔薪資通知\n・26日 09:00 月底結算前置提醒（補 Joyce／孟潔資料）\n\n【每年】\n・6/26 09:00 GitHub Token 到期提醒"
              }]
            }'
