name: 每月11號入帳提醒（21888）

on:
  schedule:
    - cron: '0 1 11 * *'  # 每月 11 日 09:00 台灣時間（UTC+8）
  workflow_dispatch:

jobs:
  send-reminder:
    runs-on: ubuntu-latest
    steps:
      - name: 傳送 LINE 提醒
        run: |
          curl -s -X POST https://api.line.me/v2/bot/message/push \
            -H "Authorization: Bearer ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"to": "${{ secrets.LINE_USER_ID }}", "messages": [{"type": "text", "text": "💰 每月提醒：檢查 21888 是否入帳"}]}'
