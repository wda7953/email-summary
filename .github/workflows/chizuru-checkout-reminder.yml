name: 千鶴髮品結帳每日提醒

on:
  schedule:
    - cron: '0 1 * * *'  # 每天 09:00 台灣時間（UTC+8），直到完成後手動停用
  workflow_dispatch:

jobs:
  send-reminder:
    runs-on: ubuntu-latest
    steps:
      - name: 傳送 LINE 提醒
        run: |
          curl -s -X POST https://api.line.me/v2/bot/message/push \
            -H "Authorization: Bearer ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"to": "${{ secrets.LINE_USER_ID }}", "messages": [{"type": "text", "text": "💇 每日提醒：千鶴髮品要結帳（完成後跟 AI 說一聲就停）"}]}'
