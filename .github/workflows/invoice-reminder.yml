name: 每月開發票提醒

on:
  # 每月 1 號 09:00 台灣時間，由 cron-job.org 外部觸發（Asia/Taipei）
  # 2026-09-01 由 GitHub 內建排程改成 workflow_dispatch：內建排程月初常漏發／延遲數小時
  workflow_dispatch:

jobs:
  send-reminder:
    runs-on: ubuntu-latest
    steps:
      - name: 傳送 LINE 提醒
        run: |
          curl -s -X POST https://api.line.me/v2/bot/message/push \
            -H "Authorization: Bearer ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"to": "${{ secrets.LINE_USER_ID }}", "messages": [{"type": "text", "text": "🧾 提醒：這個月的發票該開了！"}]}'
