name: 柔力收入自動匯入記帳

on:
  # 柔力現金收款「當月認列」→ 每天匯「當月＋上月」進記帳 App。GH 原生排程：22:00 UTC = 台灣 06:00。
  # 寫入前先讀 income 既有 client_id 只補新的；冪等(client_id=stuapp_<id>)，重跑不重複。有新進帳才發 LINE。
  schedule:
    - cron: "0 22 * * *"
  workflow_dispatch:
    inputs:
      month:
        description: "指定月份補匯，格式 YYYY-MM（留空＝匯 當月＋上月）"
        type: string
        default: ""

jobs:
  import-income:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安裝套件
        run: pip install google-api-python-client google-auth pytz requests

      - name: 匯入柔力收入
        env:
          GDRIVE_REFRESH_TOKEN:      ${{ secrets.GDRIVE_REFRESH_TOKEN }}
          GOOGLE_CLIENT_ID:          ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET:      ${{ secrets.GOOGLE_CLIENT_SECRET }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID:              ${{ secrets.LINE_USER_ID }}
          MONTH_OVERRIDE:            ${{ inputs.month }}
        run: python import_roulie_income.py
