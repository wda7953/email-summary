name: 收入月報（武士+柔力）

on:
  # 每月 1 號 00:00 台灣時間，由 cron-job.org 外部觸發（Asia/Taipei，每月 1 號一次）
  # 2026-09-01 由「1 日 22:00」改為「1 號 00:00」，與武士月業績報告同日（武士月底 22:00、收入次日 00:00）
  # 腳本報「台灣昨天所屬的月」＝上月，整個 1 號都成立、不怕延遲，故不需日期判斷；要補其他月填 month
  workflow_dispatch:
    inputs:
      month:
        description: "指定月份補發，格式 YYYY-MM（留空＝依排程報上月）"
        type: string
        default: ""

jobs:
  send-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安裝套件
        run: pip install google-api-python-client google-auth pytz requests

      - name: 執行月報
        env:
          GDRIVE_REFRESH_TOKEN:      ${{ secrets.GDRIVE_REFRESH_TOKEN }}
          GOOGLE_CLIENT_ID:          ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET:      ${{ secrets.GOOGLE_CLIENT_SECRET }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID:              ${{ secrets.LINE_USER_ID }}
          MONTH_OVERRIDE:            ${{ inputs.month }}
        run: python roulie_monthly_report.py
